type = "batch"
timelimit = "2s"
match = "float"

[float]
relative-error = 1e-5
absolute-error = 1e-5

[[cases]]
name = "sample1"
in = '''
2
10 30
'''
out = '''
7.5
'''

[[cases]]
name = "sample2"
in = '''
3
200 200 200
'''
out = '''
66.66666666666667
'''

[[cases]]
name = "sample3"
in = '''
1
1000
'''
out = '''
1000
'''
