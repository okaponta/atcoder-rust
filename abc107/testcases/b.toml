type = "batch"
timelimit = "2s"
match = "lines"

[[cases]]
name = "sample1"
in = '''
4 4
##.#
....
##.#
.#.#
'''
out = '''
###
###
.##
'''

[[cases]]
name = "sample2"
in = '''
3 3
#..
.#.
..#
'''
out = '''
#..
.#.
..#
'''

[[cases]]
name = "sample3"
in = '''
4 5
.....
.....
..#..
.....
'''
out = '''
#
'''

[[cases]]
name = "sample4"
in = '''
7 6
......
....#.
.#....
..#...
..#...
......
.#..#.
'''
out = '''
..#
#..
.#.
.#.
#.#
'''
