type = "batch"
timelimit = "2s"
match = "lines"

[[cases]]
name = "sample1"
in = '''
5 6
......
..#.#.
..###.
..###.
......
'''
out = '''
2 4
'''

[[cases]]
name = "sample2"
in = '''
3 2
#.
##
##
'''
out = '''
1 2
'''

[[cases]]
name = "sample3"
in = '''
6 6
..####
..##.#
..####
..####
..####
......
'''
out = '''
2 5
'''
