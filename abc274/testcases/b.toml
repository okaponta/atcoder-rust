type = "batch"
timelimit = "2s"
match = "lines"

[[cases]]
name = "sample1"
in = '''
3 4
#..#
.#.#
.#.#
'''
out = '''
1 2 0 3
'''

[[cases]]
name = "sample2"
in = '''
3 7
.......
.......
.......
'''
