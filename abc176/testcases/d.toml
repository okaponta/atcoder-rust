type = "batch"
timelimit = "2s"
match = "lines"

[[cases]]
name = "sample1"
in = '''
4 4
1 1
4 4
..#.
..#.
.#..
.#..
'''
out = '''
1
'''

[[cases]]
name = "sample2"
in = '''
4 4
1 4
4 1
.##.
####
####
.##.
'''
out = '''
-1
'''

[[cases]]
name = "sample3"
in = '''
4 4
2 2
3 3
....
....
....
....
'''
out = '''
0
'''

[[cases]]
name = "sample4"
in = '''
4 5
1 2
2 5
#.###
####.
#..##
#..##
'''
out = '''
2
'''
