type = "batch"
timelimit = "2s"
match = "float"

[float]
relative-error = 1e-6
absolute-error = 1e-6

[[cases]]
name = "sample1"
in = '''
5
1 1 4 5 3
'''
out = '''
2.80000000
3.33333333
4.50000000
5.00000000
3.00000000
'''

[[cases]]
name = "sample2"
in = '''
3
999999 1 1000000
'''
out = '''
999999.00000000
500000.50000000
1000000.00000000
'''
