---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      6
      3 1 4 1 5 2
    out: |
      2
  - name: sample2
    in: |
      5
      1 1 1 2 1
    out: |
      1
  - name: sample3
    in: |
      10
      7 3 9 8 10 3 1 5 5 4
    out: |
      2

extend:
  - type: Text
    path: "./a"
    in: /in/*.txt
    out: /out/*.txt
