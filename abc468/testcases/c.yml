---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      3
      1 3 2
      3 1 2
    out: |
      2
  - name: sample2
    in: |
      5
      5 4 2 1 3
      5 1 2 3 4
    out: |
      0
  - name: sample3
    in: |
      7
      3 6 5 2 7 1 4
      4 1 5 7 2 3 6
    out: |
      223

extend:
  - type: Text
    path: "./c"
    in: /in/*.txt
    out: /out/*.txt
