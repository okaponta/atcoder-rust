---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      7 1
      .G...GG
    out: |
      1
  - name: sample2
    in: |
      6 5
      ......
    out: |
      6
  - name: sample3
    in: |
      21 2
      ....G...GG.....G.....
    out: |
      6

extend:
  - type: Text
    path: "./b"
    in: /in/*.txt
    out: /out/*.txt
