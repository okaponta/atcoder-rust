type = "batch"
timelimit = "2s"
match = "float"

[float]
relative-error = 1e-5
absolute-error = 1e-5

[[cases]]
name = "sample1"
in = '''
5 2 4 10 4
'''
out = '''
15.0000000000000000
'''

[[cases]]
name = "sample2"
in = '''
10 6 6 1 2
'''
out = '''
0.0000000000000000
'''

[[cases]]
name = "sample3"
in = '''
1000000000 1000000000 1 1000000000 1000000000
'''
out = '''
1000000000000000000.0000000000000000
'''
