type = "batch"
timelimit = "2s"
match = "float"

[float]
relative-error = 1e-6
absolute-error = 1e-6

[[cases]]
name = "sample1"
in = '''
1 1 7 2
'''
out = '''
3.0000000000
'''

[[cases]]
name = "sample2"
in = '''
1 1 3 2
'''
out = '''
1.6666666667
'''

[[cases]]
name = "sample3"
in = '''
-9 99 -999 9999
'''
out = '''
-18.7058823529
'''
