type = "batch"
timelimit = "2s"
match = "lines"

[[cases]]
name = "sample1"
in = '''
#..#.
'''
out = '''
#o.#o
'''

[[cases]]
name = "sample2"
in = '''
#
'''
out = '''
#
'''

[[cases]]
name = "sample3"
in = '''
.....
'''
out = '''
..o..
'''

[[cases]]
name = "sample4"
in = '''
...#..#.##.#.
'''
out = '''
o..#.o#o##o#o
'''
